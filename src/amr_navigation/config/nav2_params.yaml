amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id:   base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    # 🔴 SỬA 2026-09-09: 0.15 là SAI — ĐÚNG con bug đã sửa ở slam_toolbox hôm 09-08.
    # Cụm PCB + Jetson lắp sau xe che LiDAR tới bán kính 0.236m (tia gần nhất 0.11m).
    # Nếu để 0.15 thì AMCL coi phần 0.15..0.236m là vật cản THẬT, mà chúng đứng yên
    # so với xe ở MỌI tư thế -> khớp vào bản đồ sai -> định vị trôi. Phải khớp đúng
    # min_laser_range=0.28 đang dùng bên slam_toolbox.
    laser_min_range: 0.28
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Nav2 KHÔNG có motion model riêng cho Ackermann. Differential là lựa chọn đúng
    # ở đây: /odom của ta vốn được tính theo kiểu differential-drive từ 2 bánh SAU
    # (d=(dl+dr)/2, dtheta=(dr-dl)/track_width), nên đặc tính nhiễu khớp mô hình này.
    # alpha1..5 để mặc định 0.2 — cần tune nếu thấy đám hạt phân tán/hội tụ sai.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan

    # 🔴 THÊM 2026-09-09 — nếu thiếu, TOÀN BỘ Nav2 không bao giờ khởi động được.
    # Chuỗi phụ thuộc: AMCL chưa có vị trí ban đầu -> không phát TF map->odom ->
    # global_costmap không kích hoạt ("Invalid frame ID map ... frame does not
    # exist") -> planner_server kẹt mãi ở "Activating" -> lifecycle_manager_
    # navigation không hoàn tất -> controller/bt_navigator nằm im. Triệu chứng dễ
    # đánh lừa: chỉ thấy "Managed nodes are active" MỘT lần (của localization),
    # không có lỗi đỏ nào, mà Nav2 vẫn không nhận goal.
    #
    # set_initial_pose=true cho AMCL tự định vị lúc khởi động, không cần RViz.
    #
    # ⚠️ QUY TẮC VẬN HÀNH kèm theo: (0,0,0) là GỐC BẢN ĐỒ = đúng chỗ xe đứng lúc
    # bấm chạy SLAM. Nên trước khi bật Nav2 phải ĐẶT XE VỀ ĐÚNG ĐIỂM XUẤT PHÁT ĐÓ,
    # hoặc sửa lại tư thế bằng "2D Pose Estimate" trong RViz sau khi bật.
    # Đặt sai chỗ thì AMCL khớp nhầm và xe sẽ đi sai hoàn toàn.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame:  map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator/NavigateThroughPosesNavigator
    # 🔴 SỬA 2026-09-09: scaffold khai báo 2 thư viện KHÔNG TỒN TẠI trong Nav2
    # Humble (`nav2_goal_update_action_bt_node`, `nav2_navigate_to_charging_station_
    # action_bt_node` — chúng thuộc bản Nav2 mới hơn). bt_navigator nạp không được
    # -> ném exception lúc configure -> lifecycle_manager HUỶ TOÀN BỘ bringup.
    # Triệu chứng: "Failed to bring up all requested nodes. Aborting bringup."
    # Đã đối chiếu từng dòng với thư viện thật trong /opt/ros/humble/lib/.
    plugin_lib_names:
      - nav2_get_pose_from_path_action_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_progress_checker_selector_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_low_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      # Dùng Regulated Pure Pursuit — phù hợp với Ackermann
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # 0.25 m/s: CLAUDE.md khuyến nghị indoor 0.25-0.3 để PID còn "khoảng dự trữ ga"
      # bù dốc/tải. Chạy sát 0.5 (full ga) thì PID bão hoà, mất khả năng điều tiết.
      desired_linear_vel: 0.25
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8  # không dùng với Ackermann thuần
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false     # false với Ackermann (không quay tại chỗ)
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.21  # circumscribed radius: sqrt((0.152)²+(0.134)²) ≈ 0.20m
      # VoxelLayer (mặc định nav2_bringup) đổi sang ObstacleLayer: ta CHỈ có LiDAR 2D,
      # không có cảm biến chiều sâu nào, nên chia ô 3D theo trục z là tính toán thừa.
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.30  # CẦN TUNE khi chạy thật (bán kính xe 0.21)
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          # 🔴 SỬA 2026-09-09: min_range 0.0 là SAI VÀ NGUY HIỂM NHẤT trong file này.
          # Cụm PCB+Jetson sau xe cho tia 0.11-0.236m. Với min_range=0 thì costmap
          # ĐÁNH DẤU chính cụm đó thành vật cản, và vì nó đi theo xe nên xe luôn tự
          # thấy mình bị chặn phía sau -> inflation trùm lên chỗ xe đang đứng -> Nav2
          # kết luận "đang ở trong vật cản", từ chối lập đường, hoặc gọi recovery liên
          # tục. Phải khớp 0.28 như slam_toolbox và AMCL.
          raytrace_min_range: 0.28
          obstacle_max_range: 2.5
          obstacle_min_range: 0.28
      static_layer:
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # 🔴 SỬA 2026-09-09: 0.15 là SAI — NHỎ HƠN kích thước thật của xe.
      # Xe 304x268mm -> bán kính ngoại tiếp = sqrt(0.152² + 0.134²) = 0.2026m.
      # Để 0.15 thì planner tưởng xe nhỏ hơn thật -> vẽ đường qua khe xe KHÔNG lọt.
      # Phải khớp 0.21 của local_costmap (0.2026 + lề an toàn).
      robot_radius: 0.21
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.28   # xem giải thích ở local_costmap
          obstacle_max_range: 2.5
          obstacle_min_range: 0.28
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""  # set tại runtime qua argument

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    # Smac Hybrid nặng hơn Navfn nhiều (tìm trong không gian 3 chiều x,y,góc) nên
    # 20Hz là quá cao và vô ích — Nav2 chỉ lập lại đường khi cần.
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      # 🔴 SỬA 2026-09-09: bản scaffold dùng nav2_navfn_planner/NavfnPlanner.
      # Navfn (và mọi Dijkstra/A*/Theta* 2D) coi robot là MỘT ĐIỂM/HÌNH TRÒN đi được
      # mọi hướng -> đường nó vẽ có thể bẻ góc vuông tại chỗ. Xe Ackermann KHÔNG
      # thực hiện được đường đó: RPP sẽ cố bám, cắt góc, và đâm vào tường.
      #
      # Smac Hybrid-A* VẪN LÀ A*, nhưng tìm trong không gian (x, y, HƯỚNG) và mỗi
      # bước đi là một cung tròn hợp lệ với bán kính cua tối thiểu của xe. Đường ra
      # đảm bảo xe chạy được về mặt động học.
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1

      # false: KHÔNG lập đường xuyên vùng chưa quét. Bản đồ có ~60% ô "chưa biết"
      # (nhà tắm/phòng ngủ/sau vật cản) — cho phép unknown sẽ dụ xe đi vào đó.
      allow_unknown: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      # ⭐ SỐ ĐO THẬT CỦA XE, không phải số đoán. Đo bằng test vòng tròn bẻ hết lái
      # (góc bánh 19.81° sau khi chốt ACK_STEER_GAIN=0.566): R = H/tan(19.81°).
      # Thực đo 0.585m (trái) / 0.615m (phải). Xem CLAUDE.md Giai đoạn 2.
      minimum_turning_radius: 0.583

      # ⚠️ "DUBIN" = CHỈ ĐƯỢC TIẾN. Đây là lựa chọn AN TOÀN có chủ đích, KHÔNG phải
      # thiếu sót: cụm PCB+Jetson sau xe làm LiDAR MÙ 70° ngay hướng lùi. Cho Nav2
      # tự lùi lúc này là cho nó lùi mù.
      # Đổi sang "REEDS_SHEPP" (cho lùi, mở khoá quay đầu 3 điểm trong hành lang
      # 115cm) CHỈ SAU KHI đã nâng LiDAR cao hơn Jetson / dời Jetson.
      motion_model_for_search: "DUBIN"

      angle_quantization_bins: 72        # 5°/bin
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0               # chỉ có tác dụng khi bật REEDS_SHEPP
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # ⚠️ CHƯA SỬA ĐƯỢC BẰNG FILE NÀY — ghi lại để không quên:
    #   "spin"   = xoay tại chỗ. Xe Ackermann KHÔNG xoay tại chỗ được. Nếu Nav2 gọi
    #              recovery này, firmware vào nhánh v≈0 -> bánh trước đánh lái nhưng
    #              xe đứng im -> recovery "chạy" mà không đạt gì, rồi timeout.
    #              Không nguy hiểm, nhưng lãng phí và che mất nguyên nhân kẹt thật.
    #   "backup" = lùi 15cm. NGUY HIỂM hơn: xe mù 70° đúng hướng lùi.
    # Không gỡ khỏi danh sách được vì cây hành vi (BT) mặc định của Nav2 có gọi tới
    # chúng — gỡ plugin mà BT vẫn gọi thì BT báo lỗi server không tồn tại.
    # ➜ VIỆC CẦN LÀM: viết BT XML riêng cho Ackermann (bỏ Spin + BackUp, giữ
    #    ClearCostmap + Wait) rồi trỏ `default_nav_to_pose_bt_xml` ở bt_navigator.
    #    Trong lúc chưa có: CHỈ test có người trông, sẵn sàng cắt nguồn.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # 🔴 SỬA 2026-09-09: [0.5, _, 1.0] là giới hạn BỊA, không phải khả năng thật.
    #   x = 0.30 : 0.5 m/s là FULL GA của xe (đo thực 0.55) — chạy sát đó thì PID
    #              bão hoà. 0.30 khớp khuyến nghị indoor.
    #   θ = 0.55 : ω tối đa xe ĐẠT ĐƯỢC = v·tan(góc bánh max)/H
    #              = 0.30 × tan(19.81°) / 0.21 = 0.515 rad/s.
    #              Để 1.0 thì Nav2 liên tục đòi mức xe không bao giờ đáp ứng nổi ->
    #              controller tưởng xe không nghe lời, sinh dao động.
    #   lùi giới hạn chặt hơn tiến (0.15) vì xe mù 70° phía sau.
    max_velocity: [0.30, 0.0, 0.55]
    min_velocity: [-0.15, 0.0, -0.55]
    # Gia tốc 2.5 m/s² là của robot vi sai nhỏ; xe ta nặng hơn và có PID riêng.
    # Đặt vừa phải, CẦN TUNE khi chạy thật.
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
